name: Deploy Potter.ai

on:
  push:
    branches:
      - master

permissions:
  contents: read
  packages: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        run: |
          docker build \
          -f potter-frontend/Dockerfile \
          --build-arg VITE_S3_URL="${{ secrets.VITE_S3_URL }}" \
          --build-arg VITE_GOOGLE_CLIENT_ID="${{ secrets.VITE_GOOGLE_CLIENT_ID }}" \
          -t ghcr.io/trishna0703/potter-frontend:latest \
          ./potter-frontend

      - name: Push frontend image
        run: |
          docker push ghcr.io/trishna0703/potter-frontend:latest

  deploy:
    needs: build-frontend
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            cd /home/ubuntu/potter.ai

            git fetch origin master
            git reset --hard origin/master

            docker pull ghcr.io/trishna0703/potter-frontend:latest

            docker compose up -d

            docker compose exec -T backend uv run alembic upgrade head

            docker compose up -d --force-recreate nginx
