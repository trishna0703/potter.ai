services:
  postgres:
    image: postgres:18
    container_name: potter-postgres-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data_dev:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - potter-net-dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: potter-backend-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/app
      - /app/.venv
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    networks:
      - potter-net-dev

  frontend:
    build:
      context: ./potter-frontend
      dockerfile: Dockerfile.dev
    container_name: potter-frontend-dev
    restart: unless-stopped
    volumes:
      - ./potter-frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    networks:
      - potter-net-dev

networks:
  potter-net-dev:
    driver: bridge

volumes:
  postgres_data_dev: