services:
  postgres:
    image: postgres:18
    container_name: potter-postgres
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - potter-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: potter-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"
    networks:
      - potter-net

  frontend:
    build:
      context: ./potter-frontend
      dockerfile: Dockerfile
    container_name: potter-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - potter-net

  nginx:
    image: nginx:alpine
    container_name: potter-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on: 
      - backend
      - frontend
    networks:
      - potter-net

  certbot:
    image: certbot/certbot
    container_name: potter-certbot
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    networks:
      - potter-net

networks:
  potter-net:
    driver: bridge

volumes:
  postgres_data:
  certbot_www:
  certbot_certs:
